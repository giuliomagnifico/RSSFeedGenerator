name: Update RSS feeds

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: update-rss-feeds
  cancel-in-progress: false

jobs:
  update-feeds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create runtime config
        run: cp Config.sample.py Config.py

      - name: Generate Il Post feed
        run: python ilpost.py
        continue-on-error: true

      - name: Generate Avvenire feed
        run: python avvenire.py
        continue-on-error: true

      - name: Generate La Stampa feed
        run: python lastampa.py
        continue-on-error: true

      - name: Update generated feed metadata
        run: |
          python - <<'PY'
          from lxml import etree as ET
          from pathlib import Path

          site_url = "https://giuliomagnifico.github.io/RSSFeedGenerator/"
          generators = {
              "avvenire.xml": "Avvenire by Giulio Magnifico",
              "ilpost.xml": "Il Post by Giulio Magnifico",
              "lastampa.xml": "La Stampa by Giulio Magnifico",
          }

          for filename, generator_text in generators.items():
              path = Path(filename)
              if not path.exists():
                  continue

              parser = ET.XMLParser(remove_blank_text=True)
              tree = ET.parse(str(path), parser)
              channel = tree.getroot().find("channel")

              if channel is None:
                  continue

              link = channel.find("link")
              if link is not None:
                  link.text = site_url

              generator = channel.find("generator")
              if generator is not None:
                  generator.text = generator_text

              tree.write(
                  str(path),
                  pretty_print=True,
                  xml_declaration=True,
                  encoding="UTF-8",
              )
          PY

      - name: Commit updated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.xml'
          if git diff --cached --quiet; then
            echo "No feed changes to commit"
            exit 0
          fi
          git commit -m "Update RSS feeds"
          git pull --rebase origin master
          git push origin master
